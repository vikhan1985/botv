[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E","F","I","B","UP","SIM","PL"]
ignore = []
exclude = [".venv","__pycache__","archive"]
fix = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = false
